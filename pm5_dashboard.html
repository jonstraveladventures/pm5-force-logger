<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM5 Live</title>
<style>
  :root {
    --surface: #1a1a19; --panel: #232322; --grid: #3a3a38; --ink: #ffffff; --ink2: #c3c2b7; --ink3: #8d8c84;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --good: #3aa655; --warn: #d9a300;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 12px 20px 4px; }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  #conn { font-size: 13px; color: var(--ink3); }
  #conn.live { color: var(--good); }
  #banner { margin-left: auto; font-size: 13px; color: var(--ink2); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; padding: 8px 20px; }
  .tile { background: var(--panel); border-radius: 10px; padding: 10px 12px; }
  .tile .label { font-size: 12px; color: var(--ink3); text-transform: uppercase; letter-spacing: .04em; }
  .tile .value { font-size: clamp(22px, 2.3vw, 34px); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 2px; white-space: nowrap; }
  .tile .sub { font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(300px, 1fr); gap: 12px; padding: 4px 20px 12px; }
  .panel { background: var(--panel); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .panel h2 { font-size: 14px; font-weight: 600; margin: 0 0 6px; color: var(--ink2); }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; }
  .swatch { width: 18px; height: 0; border-top: 3px solid; display: inline-block; }
  .swatch.dash { border-top-style: dashed; }
  canvas { width: 100%; display: block; }
  #curve { height: 380px; }
  .metrics { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; font-size: 14px; align-items: baseline; }
  .metrics .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .metrics .t { font-size: 12px; color: var(--ink3); }
  .metrics .note { grid-column: 1 / -1; font-size: 12px; color: var(--ink3); margin: -2px 0 6px; }
  .flag { font-size: 12px; font-weight: 600; }
  .flag.ok { color: var(--good); } .flag.off { color: var(--warn); }
  .trends { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; padding: 0 20px 12px; }
  .trends canvas { height: 120px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink3); font-weight: 500; }
  .tablewrap { overflow-x: auto; padding: 0 20px 20px; }
  button, select { background: #2f2f2d; color: var(--ink); border: 1px solid var(--grid); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 13px; cursor: pointer; }
  #hover { font-size: 12px; color: var(--ink2); min-height: 16px; font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>PM5 Live</h1><span id="conn">connecting…</span><span id="banner"></span>
</header>

<section class="tiles" id="tiles"></section>

<main>
  <div class="panel">
    <div class="row" style="justify-content: space-between">
      <h2>Force curve</h2>
      <div class="row">
        <label>Curve <select id="src"><option value="force_curve_v2">new channel (one point per reading)</option><option value="force_curve">documented channel (time steps)</option></select></label>
        <label>Compare to <select id="refsel"><option value="kleshnev">reference shape (Kleshnev targets)</option><option value="mine">my saved reference</option></select></label>
        <button id="saveref" title="Store this session's average curve as your personal reference">Save average as my reference</button>
      </div>
    </div>
    <div class="row legend">
      <span><i class="swatch" style="border-color: var(--s1)"></i>this stroke</span>
      <span><i class="swatch" style="border-color: rgba(57,135,229,.35)"></i>last 8 strokes</span>
      <span><i class="swatch" style="border-color: var(--s3)"></i>session average</span>
      <span><i class="swatch dash" style="border-color: var(--s2)"></i>reference</span>
    </div>
    <canvas id="curve"></canvas>
    <div id="hover"></div>
  </div>
  <div class="panel">
    <h2 id="shapeTitle">Curve shape, this stroke</h2>
    <div class="metrics" id="metrics"></div>
  </div>
</main>

<section class="trends" id="trends"></section>

<div class="tablewrap">
  <table id="table"><thead><tr>
    <th>Stroke</th><th>Drive m</th><th>Drive s</th><th>Recov s</th><th>Ratio</th><th>Dist/stroke m</th><th>Peak lbf</th><th>Avg lbf</th><th>Work J</th><th>Power W</th><th>Peak pos</th><th>Rect idx</th><th>HR</th>
  </tr></thead><tbody></tbody></table>
</div>

<script>
// ---------- state ----------
const S = { strokes: new Map(), status: {}, summary: {}, device: {} };
const TARGETS = {  // Kleshnev (2011), Biomechanics of Rowing, via biomex.studio; on-water gate force, so guides not rules
  a100: { lo: 0, hi: 40, label: "≤40%" }, a70: { lo: 0, hi: 17, label: "≤17%" },
  d70: { lo: 28, hi: 40, label: "28–40%" }, ram: { lo: 38, hi: 64, label: "38–64%" }, dips: { lo: 0, hi: 0, label: "none" },
};
// Reference shape built to meet those targets (A100 40%, A70 ~15%, D70 ~33%, Ra-m ~62%). A template, not a measured curve.
const KLESHNEV_PTS = [[0,0],[.05,.35],[.15,.72],[.25,.9],[.4,1],[.55,.93],[.73,.7],[.85,.45],[.95,.15],[1,0]];

// ---------- curve maths ----------
function trim(p) { if (!p || p.length < 3) return null; let a = 0, b = p.length - 1; while (a < b && p[a] <= 0) a++; while (b > a && p[b] <= 0) b--; return b - a >= 2 ? p.slice(a, b + 1) : null; }
function resample(p, n = 101) { const m = p.length; return Array.from({ length: n }, (_, i) => { const x = i * (m - 1) / (n - 1), j = Math.floor(x), f = x - j; return j + 1 < m ? p[j] * (1 - f) + p[j + 1] * f : p[m - 1]; }); }
function fromControl(pts, n = 101) { // monotone-ish piecewise cubic (Catmull-Rom, clamped)
  const out = []; for (let i = 0; i < n; i++) { const x = i / (n - 1); let k = 0; while (k < pts.length - 2 && x > pts[k + 1][0]) k++;
    const p0 = pts[Math.max(0, k - 1)], p1 = pts[k], p2 = pts[k + 1], p3 = pts[Math.min(pts.length - 1, k + 2)]; const t = (x - p1[0]) / (p2[0] - p1[0] || 1);
    const t2 = t * t, t3 = t2 * t; const y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
    out.push(Math.max(0, y)); } return out; }
function metrics(points) {
  const tp = trim(points); if (!tp) return null;
  const r = resample(tp); const fmax = Math.max(...r), imax = r.indexOf(fmax); const mean = r.reduce((a, b) => a + b, 0) / r.length;
  const a70 = r.findIndex(v => v >= 0.7 * fmax); let j = imax; while (j < 100 && r[j + 1] >= 0.7 * fmax) j++;
  let dips = 0, runMax = 0, inDip = false; // a "blip": after force passes 50% of peak, it falls >=8% of peak then recovers >=5%
  for (let i = 0; i < r.length; i++) { const v = r[i]; if (v > runMax) { if (inDip && v - lowest >= 0.05 * fmax) { dips++; inDip = false; } runMax = v; }
    if (runMax >= 0.5 * fmax && runMax - v >= 0.08 * fmax && i < imax + 1) { if (!inDip) { inDip = true; var lowest = v; } lowest = Math.min(lowest, v); } }
  return { norm: r.map(v => v / fmax), fmax, a100: imax, a70, d70: j - imax, ram: 100 * mean / fmax, dips };
}
function rmsePct(a, b) { if (!a || !b) return null; let s = 0; for (let i = 0; i < a.length; i++) s += (a[i] - b[i]) ** 2; return 100 * Math.sqrt(s / a.length); }
function meanCurve(list) { const c = list.filter(Boolean); if (!c.length) return null; const m = c[0].map((_, i) => c.reduce((s, x) => s + x[i], 0) / c.length); const mx = Math.max(...m); return m.map(v => v / mx); }

// ---------- formatting ----------
const fmtPace = s => !s ? "—" : `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
const fmtTime = s => s == null ? "—" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const n0 = v => v == null || Number.isNaN(v) ? "—" : Math.round(v).toString();
const n1 = v => v == null || Number.isNaN(v) ? "—" : v.toFixed(1);
const n2 = v => v == null || Number.isNaN(v) ? "—" : v.toFixed(2);

// ---------- tiles ----------
const TILE_DEFS = [
  ["time", "Time"], ["dist", "Distance"], ["pace", "Pace /500m"], ["rate", "Rate"], ["power", "Power"], ["hr", "Heart rate"],
  ["peak", "Peak force"], ["drive", "Drive"], ["ratio", "Drive : recovery"], ["stroke", "Per stroke"], ["drag", "Drag factor"], ["cal", "Calories"],
];
document.getElementById("tiles").innerHTML = TILE_DEFS.map(([k, l]) => `<div class="tile"><div class="label">${l}</div><div class="value" id="v_${k}">—</div><div class="sub" id="s_${k}"></div></div>`).join("");
const setTile = (k, v, sub = "") => { document.getElementById("v_" + k).textContent = v; document.getElementById("s_" + k).textContent = sub; };
function renderTiles() {
  const st = S.status, last = lastStroke();
  const target = st.workout_type != null && st.workout_type > 1;  // projections mean nothing on a Just Row (types 0, 1)
  setTile("time", fmtTime(st.elapsed_s), target && st.projected_time_s ? `projected ${fmtTime(st.projected_time_s)}` : "");
  setTile("dist", st.distance_m != null ? `${Math.round(st.distance_m)} m` : "—", target && st.projected_distance_m ? `projected ${st.projected_distance_m} m` : "");
  setTile("pace", fmtPace(st.pace_s), st.avg_pace_s ? `average ${fmtPace(st.avg_pace_s)}` : "");
  setTile("rate", n0(st.stroke_rate), "strokes/min");
  setTile("power", last && last.power_w != null ? `${last.power_w} W` : "—", st.avg_power_w ? `average ${st.avg_power_w} W` : "");
  setTile("hr", st.hr ? n0(st.hr) : "—", st.hr ? "bpm" : "no HR source paired");
  setTile("peak", last ? `${n0(last.peak_force_lbf)}` : "—", last ? `lbf · average ${n0(last.avg_force_lbf)}` : "");
  setTile("drive", last ? `${n2(last.drive_length_m)} m` : "—", last ? `${n2(last.drive_time_s)} s` : "");
  const prev = S.strokes.get(last && last.stroke_count - 1); const rec = last && (last.recovery_time_s ?? (prev && prev.recovery_time_s));
  setTile("ratio", last && rec ? `1 : ${n1(rec / last.drive_time_s)}` : "—", "target about 1 : 2");
  setTile("stroke", last ? `${n1(last.stroke_distance_m)} m` : "—", last ? `work ${n0(last.work_j)} J` : "");
  setTile("drag", n0(st.drag_factor), S.summary.drag_factor_avg ? `session ${S.summary.drag_factor_avg}` : "");
  setTile("cal", n0(st.calories_total), "kcal");
}

// ---------- charts ----------
function setupCanvas(c) { const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight; if (c.width !== w * dpr || c.height !== h * dpr) { c.width = w * dpr; c.height = h * dpr; } const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h); return [g, w, h]; }
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const src = () => document.getElementById("src").value;
const refKey = () => document.getElementById("refsel").value;
const KLESHNEV = fromControl(KLESHNEV_PTS);
function reference() { if (refKey() === "mine") { try { return JSON.parse(localStorage.getItem("pm5_my_reference")); } catch { return null; } } return KLESHNEV; }
const strokesWithCurves = () => [...S.strokes.values()].filter(s => trim(s[src()])).sort((a, b) => a.stroke_count - b.stroke_count);
const lastStroke = () => { const all = [...S.strokes.values()]; return all.length ? all.reduce((a, b) => b.stroke_count > a.stroke_count ? b : a) : null; };

let hoverX = null;
function drawCurve() {
  const c = document.getElementById("curve"); const [g, w, h] = setupCanvas(c);
  const pad = { l: 44, r: 16, t: 10, b: 44 }, pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
  const list = strokesWithCurves(); const cur = list[list.length - 1];
  const recent = list.slice(-9, -1);
  const series = list.map(s => metrics(s[src()])).filter(Boolean);
  const avg = meanCurve(series.map(m => m.norm));
  const ymax = Math.max(40, ...list.slice(-9).map(s => Math.max(...trim(s[src()])))) * 1.1;
  // grid + axes
  g.strokeStyle = css("--grid"); g.lineWidth = 1; g.fillStyle = css("--ink3"); g.font = "11px -apple-system, sans-serif";
  for (let f = 0; f <= ymax; f += ymax > 150 ? 50 : 25) { const y = pad.t + ph - f / ymax * ph; g.beginPath(); g.moveTo(pad.l, y); g.lineTo(w - pad.r, y); g.stroke(); g.fillText(`${f}`, 8, y + 4); }
  g.textAlign = "center";
  for (let p = 0; p <= 100; p += 20) g.fillText(`${p}%`, pad.l + p / 100 * pw, pad.t + ph + 16);
  g.fillText("drive, from first force to release (normalised)", pad.l + pw / 2, h - 6);
  g.save(); g.translate(12, pad.t + ph / 2); g.rotate(-Math.PI / 2); g.fillText("force (lbf)", 0, 0); g.restore();
  g.textAlign = "left";
  const X = i => pad.l + i / 100 * pw, Y = f => pad.t + ph - f / ymax * ph;
  const line = (arr, color, width, dash = [], scale = 1) => { if (!arr) return; g.setLineDash(dash); g.strokeStyle = color; g.lineWidth = width; g.beginPath(); arr.forEach((v, i) => i ? g.lineTo(X(i), Y(v * scale)) : g.moveTo(X(i), Y(v * scale))); g.stroke(); g.setLineDash([]); };
  recent.forEach(s => line(resample(trim(s[src()])), "rgba(57,135,229,.28)", 1.5));
  const curM = cur ? metrics(cur[src()]) : null; const scale = curM ? curM.fmax : (series.length ? series[series.length - 1].fmax : 1);
  line(reference(), css("--s2"), 2, [6, 5], scale);            // shapes scaled to this stroke's peak, so shape is what differs
  line(avg, css("--s3"), 2, [], scale);
  if (cur) line(resample(trim(cur[src()])), css("--s1"), 3);
  if (curM) { g.fillStyle = css("--s1"); g.beginPath(); g.arc(X(curM.a100), Y(curM.fmax), 4, 0, 7); g.fill(); }
  if (hoverX != null && cur) { const i = Math.round(Math.max(0, Math.min(100, (hoverX - pad.l) / pw * 100))); g.strokeStyle = css("--ink3"); g.beginPath(); g.moveTo(X(i), pad.t); g.lineTo(X(i), pad.t + ph); g.stroke();
    const r = resample(trim(cur[src()])); const ref = reference();
    document.getElementById("hover").textContent = `${i}% of drive · this stroke ${n0(r[i])} lbf · average ${avg ? n0(avg[i] * scale) : "—"} · reference ${ref ? n0(ref[i] * scale) : "—"}`; }
  else document.getElementById("hover").textContent = cur ? `stroke ${cur.stroke_count}: hover the chart to read values` : "waiting for the first stroke…";
}
document.getElementById("curve").addEventListener("mousemove", e => { hoverX = e.offsetX; drawCurve(); });
document.getElementById("curve").addEventListener("mouseleave", () => { hoverX = null; drawCurve(); });

function renderMetrics() {
  const list = strokesWithCurves(); const cur = list[list.length - 1]; const el = document.getElementById("metrics");
  if (!cur) { el.innerHTML = `<div class="note">Force-curve metrics appear after the first stroke.</div>`; return; }
  const m = metrics(cur[src()]); const series = list.map(s => metrics(s[src()])).filter(Boolean); const avg = meanCurve(series.map(x => x.norm));
  const ref = reference(); const inRange = (v, t) => v >= t.lo && v <= t.hi;
  const flag = (v, t, lowWord, highWord) => inRange(v, t) ? `<span class="flag ok">✓ in range</span>` : `<span class="flag off">▲ ${v > t.hi ? highWord : lowWord}</span>`;
  const rows = [
    ["Peak position", `${m.a100}%`, TARGETS.a100.label, flag(m.a100, TARGETS.a100, "early", "late"), "Where in the drive force peaks. Late peaks (past 55%) point to the back taking over from the legs."],
    ["Catch gradient", `${m.a70}%`, TARGETS.a70.label, flag(m.a70, TARGETS.a70, "", "slow"), "How far into the drive before force reaches 70% of peak: how quickly the legs load."],
    ["Finish plateau", `${m.d70}%`, TARGETS.d70.label, flag(m.d70, TARGETS.d70, "short", "long"), "How long force stays above 70% of peak after the peak: the back and arms carrying it on."],
    ["Rectangle index", `${n0(m.ram)}%`, TARGETS.ram.label, flag(m.ram, TARGETS.ram, "peaky", "flat"), "Average force as a share of peak. Higher is a fuller curve."],
    ["Blips", `${m.dips}`, TARGETS.dips.label, m.dips ? `<span class="flag off">▲ dip in the rise</span>` : `<span class="flag ok">✓ smooth</span>`, "A dip on the way up, usually the handover from legs to back."],
    ["Shape vs reference", ref ? `${n1(rmsePct(m.norm, ref))}%` : "—", "lower = closer", "", "Typical gap between this stroke's shape and the reference, as % of peak (both scaled to the same peak)."],
    ["Stroke-to-stroke", avg && series.length > 1 ? `${n1(rmsePct(m.norm, avg))}%` : "—", "lower = steadier", "", "Gap between this stroke's shape and your session average."],
  ];
  el.innerHTML = rows.map(([k, v, t, f, note]) => `<div>${k}<div class="t">target ${t} ${f}</div></div><div></div><div class="v">${v}</div><div class="note">${note}</div>`).join("");
  document.getElementById("shapeTitle").textContent = `Curve shape, stroke ${cur.stroke_count}`;
}

const TRENDS = [
  ["Peak force (lbf)", s => s.peak_force_lbf, null],
  ["Peak position (% of drive)", s => metrics(s[src()])?.a100, TARGETS.a100],
  ["Rectangle index (%)", s => metrics(s[src()])?.ram, TARGETS.ram],
  ["Drive length (m)", s => s.drive_length_m, null],
  ["Power (W)", s => s.power_w, null],
];
document.getElementById("trends").innerHTML = TRENDS.map((t, i) => `<div class="panel"><h2>${t[0]}${t[2] ? ` <span style="font-weight:400;color:var(--ink3)">· shaded: target</span>` : ""}</h2><canvas id="tr${i}"></canvas></div>`).join("");
function drawTrends() {
  const list = [...S.strokes.values()].sort((a, b) => a.stroke_count - b.stroke_count);
  TRENDS.forEach(([name, fn, band], i) => {
    const c = document.getElementById("tr" + i); const [g, w, h] = setupCanvas(c); const pad = { l: 34, r: 8, t: 6, b: 18 };
    const pts = list.map(s => [s.stroke_count, fn(s)]).filter(p => p[1] != null && !Number.isNaN(p[1]));
    g.fillStyle = css("--ink3"); g.font = "11px -apple-system, sans-serif";
    if (!pts.length) { g.fillText("no strokes yet", pad.l, h / 2); return; }
    let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1])); if (band) { lo = Math.min(lo, band.lo); hi = Math.max(hi, band.hi); }
    const span = hi - lo || 1; const floor0 = lo >= 0; lo -= span * .1; hi += span * .1; if (floor0) lo = Math.max(0, lo);
    const fmt = v => span < 5 ? v.toFixed(2) : span < 50 ? v.toFixed(1) : Math.round(v).toString();
    const x0 = pts[0][0], x1 = Math.max(pts[pts.length - 1][0], x0 + 1);
    const X = n => pad.l + (n - x0) / (x1 - x0) * (w - pad.l - pad.r), Y = v => pad.t + (1 - (v - lo) / (hi - lo)) * (h - pad.t - pad.b);
    if (band) { g.fillStyle = "rgba(58,166,85,.12)"; g.fillRect(pad.l, Y(band.hi), w - pad.l - pad.r, Y(band.lo) - Y(band.hi)); }
    g.strokeStyle = css("--grid"); g.beginPath(); g.moveTo(pad.l, h - pad.b); g.lineTo(w - pad.r, h - pad.b); g.stroke();
    g.fillStyle = css("--ink3"); g.fillText(fmt(hi), 2, pad.t + 9); g.fillText(fmt(lo), 2, h - pad.b); g.fillText(`stroke ${x0}`, pad.l, h - 4); g.fillText(`${x1}`, w - pad.r - 16, h - 4);
    g.strokeStyle = css("--s1"); g.lineWidth = 2; g.beginPath(); pts.forEach(([n, v], k) => k ? g.lineTo(X(n), Y(v)) : g.moveTo(X(n), Y(v))); g.stroke();
    const [ln, lv] = pts[pts.length - 1]; g.fillStyle = css("--s1"); g.beginPath(); g.arc(X(ln), Y(lv), 3.5, 0, 7); g.fill();
    g.fillStyle = css("--ink"); g.fillText(fmt(lv), Math.min(X(ln) + 6, w - 34), Math.max(12, Y(lv) - 6));
  });
}

function renderTable() {
  const list = [...S.strokes.values()].sort((a, b) => b.stroke_count - a.stroke_count).slice(0, 12);
  document.querySelector("#table tbody").innerHTML = list.map(s => { const m = metrics(s[src()]); const ratio = s.recovery_time_s && s.drive_time_s ? `1:${n1(s.recovery_time_s / s.drive_time_s)}` : "—";
    return `<tr><td>${s.stroke_count}</td><td>${n2(s.drive_length_m)}</td><td>${n2(s.drive_time_s)}</td><td>${n2(s.recovery_time_s)}</td><td>${ratio}</td><td>${n2(s.stroke_distance_m)}</td><td>${n0(s.peak_force_lbf)}</td><td>${n0(s.avg_force_lbf)}</td><td>${n0(s.work_j)}</td><td>${n0(s.power_w)}</td><td>${m ? m.a100 + "%" : "—"}</td><td>${m ? n0(m.ram) + "%" : "—"}</td><td>${s.hr ? s.hr : "—"}</td></tr>`; }).join("");
}

let pending = false;
function render() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; renderTiles(); drawCurve(); renderMetrics(); drawTrends(); renderTable(); }); }
window.addEventListener("resize", render);
document.getElementById("src").addEventListener("change", render);
document.getElementById("refsel").addEventListener("change", render);
document.getElementById("saveref").addEventListener("click", () => {
  const series = strokesWithCurves().map(s => metrics(s[src()])).filter(Boolean); const avg = meanCurve(series.map(m => m.norm));
  if (!avg) { alert("No force curves yet in this session."); return; }
  localStorage.setItem("pm5_my_reference", JSON.stringify(avg)); document.getElementById("refsel").value = "mine";
  document.getElementById("banner").textContent = `saved the average of ${series.length} strokes as your reference`; render();
});

// ---------- live feed ----------
const H = {
  snapshot: d => { S.strokes.clear(); d.strokes.forEach(s => S.strokes.set(s.stroke_count, s)); S.status = d.status || {}; S.summary = d.summary || {}; },
  reset: d => { S.strokes.clear(); S.status = {}; S.summary = {}; document.getElementById("banner").textContent = d.replay ? `replaying ${d.replay}` : ""; },
  device: d => { S.device = d; document.getElementById("banner").textContent = `${d.name} · firmware ${d.firmware_rev}`; },
  status: d => { S.status = d; },
  stroke: d => { S.strokes.set(d.stroke_count, d); },
  stroke_update: d => { const s = S.strokes.get(d.stroke_count); if (s) Object.assign(s, d); },
  curve: d => { const s = S.strokes.get(d.stroke_count); if (s) s[d.key] = d.points; },
  summary: d => { S.summary = d; },
  ended: d => { document.getElementById("banner").textContent = `session ${d.session} ended and saved`; },
};
function connect() {
  const es = new EventSource("/events"); const conn = document.getElementById("conn");
  es.onopen = () => { conn.textContent = "live"; conn.className = "live"; };
  es.onmessage = e => { const m = JSON.parse(e.data); (H[m.kind] || (() => {}))(m.data); render(); };
  es.onerror = () => { conn.textContent = "not connected: is the logger running?"; conn.className = ""; };
}
connect(); render();
</script>
