<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM5 Live</title>
<style>
  :root {
    --surface: #1a1a19; --panel: #232322; --grid: #3a3a38; --ink: #ffffff; --ink2: #c3c2b7; --ink3: #8d8c84;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --good: #3aa655; --warn: #d9a300;
    --text: 1; --curve-h: 270px; --curve-w: 56%; --tile-w: 150px; --trend-h: 120px;   /* the Display sliders set these; saved per browser */
  }
  html { font-size: calc(17px * var(--text)); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 1rem/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 12px 20px 4px; }
  header h1 { font-size: 1.06rem; font-weight: 600; margin: 0; }
  #conn { font-size: .76rem; color: var(--ink3); }
  #conn.live { color: var(--good); }
  #banner { margin-left: auto; font-size: .76rem; color: var(--ink2); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(var(--tile-w) * var(--text)), 1fr)); gap: 10px; padding: 8px 20px; }
  .tile { background: var(--panel); border-radius: 10px; padding: 10px 12px; }
  .tile .label { font-size: .82rem; color: var(--ink3); text-transform: uppercase; letter-spacing: .04em; }
  .tile .value { font-size: clamp(1.5rem, calc(2.5vw * var(--text)), 2.4rem); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .tile .sub { font-size: .88rem; color: var(--ink2); font-variant-numeric: tabular-nums; }
  /* the curve is a shape check; the numbers beside it are what gets read from the seat, so they get the room */
  main { display: grid; grid-template-columns: var(--curve-w) minmax(0, 1fr); gap: 12px; padding: 4px 20px 12px; }
  .panel { background: var(--panel); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .panel h2 { font-size: 1.06rem; font-weight: 600; margin: 0 0 8px; color: var(--ink2); }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: .82rem; color: var(--ink2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; }
  .swatch { width: 18px; height: 0; border-top: 3px solid; display: inline-block; }
  .swatch.dash { border-top-style: dashed; }
  canvas { width: 100%; display: block; }
  #curve { height: var(--curve-h); }
  .metrics { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 14px; font-size: 1.18rem; align-items: baseline; }
  .metrics .v { font-size: 1.76rem; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .metrics .t { font-size: .94rem; color: var(--ink3); }
  .metrics .note { grid-column: 1 / -1; font-size: .88rem; color: var(--ink3); margin: -2px 0 8px; }
  .flag { font-size: .94rem; font-weight: 600; }
  .flag.ok { color: var(--good); } .flag.off { color: var(--warn); }
  .trends { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; padding: 0 20px 12px; }
  .trends canvas { height: var(--trend-h); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 4px 7px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink3); font-weight: 500; }
  .tablewrap { overflow-x: auto; padding: 0 20px 20px; }
  button, select { background: #2f2f2d; color: var(--ink); border: 1px solid var(--grid); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: .76rem; cursor: pointer; }
  #display { margin-left: 12px; font-size: .76rem; color: var(--ink2); }
  #display summary { cursor: pointer; list-style: none; color: var(--ink3); }
  #display[open] summary { color: var(--ink2); }
  #display .sliders { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 6px 0 0; }
  #display .parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 4px 16px; padding: 4px 0 8px; max-width: 64em; }
  #display .pgroup { display: flex; flex-direction: column; gap: 2px; }
  #display .pgroup b { color: var(--ink3); font-weight: 600; }
  .hidden-part { display: none !important; }
  .hostx { position: relative; }
  .arranging { outline: 1px dashed var(--grid); outline-offset: 2px; cursor: move; resize: both; overflow: hidden; min-width: 90px; min-height: 60px; }
  .arranging * { pointer-events: none; }
  .arranging .hidex { pointer-events: auto; }
  .hidex { position: absolute; top: 4px; right: 4px; z-index: 5; background: rgba(0, 0, 0, .5); border: 1px solid var(--grid); color: var(--ink2); border-radius: 4px; font-size: .7rem; line-height: 1; padding: 3px 5px; cursor: pointer; }
  /* a long explanation kept out of the way until it is wanted */
  .hint { position: relative; color: var(--ink3); cursor: help; border-bottom: 1px dotted var(--ink3); }
  .hint .tip { display: none; position: absolute; left: 0; bottom: 1.4em; z-index: 10; width: min(34em, 80vw); background: #2f2f2d; border: 1px solid var(--grid); border-radius: 8px; padding: 8px 10px; color: var(--ink2); font-size: .82rem; line-height: 1.35; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); cursor: auto; }
  .hint:hover .tip, .hint:focus .tip, .hint:focus-within .tip { display: block; }
  #display label { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  #display input[type=range] { width: 110px; }
  .setup { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 6px 20px 2px; font-size: .82rem; color: var(--ink2); }
  .setup select { max-width: 24em; }
  .setup input[type=text], input[type=number] { background: #2f2f2d; color: var(--ink); border: 1px solid var(--grid); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: .82rem; width: 15em; }
  .setup .primary { background: var(--s1); border-color: var(--s1); color: #fff; }
  #wo_status { font-size: .82rem; } #wo_status.ok { color: var(--good); } #wo_status.err { color: var(--warn); }

  #hover { font-size: .82rem; color: var(--ink2); min-height: 18px; font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  header { flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>PM5 Live</h1><span id="conn">connecting…</span>
  <details id="display"><summary>Display ▾</summary><div class="sliders">
    <label>Text <input type="range" id="ui_text" min="0.7" max="2" step="0.05"> <span id="ui_text_v"></span></label>
    <label>Curve height <input type="range" id="ui_h" min="140" max="640" step="10"> <span id="ui_h_v"></span></label>
    <label>Curve width <input type="range" id="ui_w" min="30" max="80" step="1"> <span id="ui_w_v"></span></label>
    <label>Tile size <input type="range" id="ui_tile" min="110" max="360" step="10"> <span id="ui_tile_v"></span></label>
    <label>Trend height <input type="range" id="ui_trend" min="70" max="300" step="10"> <span id="ui_trend_v"></span></label>
    <label>Table rows <input type="range" id="ui_rows" min="3" max="30" step="1"> <span id="ui_rows_v"></span></label>
    <label><input type="checkbox" id="ui_customise"> customise: drag parts, resize by the corner, ✕ to hide</label>
    <button id="ui_showall">Show everything</button>
    <button id="ui_reset">Reset</button>
  </div><div class="parts" id="ui_parts"></div></details>
  <span id="banner"></span>
</header>

<section class="setup" id="setup">
  <span>Set up the PM5:</span>
  <label>named <select id="wo_named"><option value="">choose…</option></select></label>
  <label>or type <input type="text" id="wo_spec" placeholder="4x4:00/3:00r · 5000m/1000m · 20:00" title="distance (2000m), time (20:00), splits after a slash, NxWORK/RESTr for intervals, @pace"></label>
  <button id="wo_send" class="primary">Send to PM5</button>
  <button id="wo_clear" title="End the programmed piece on the monitor">Clear</button>
  <span id="wo_status"></span>
</section>

<section class="tiles" id="tiles"></section>

<main id="main">
  <div class="panel" id="panel_curve">
    <div class="row" style="justify-content: space-between">
      <h2>Force curve</h2>
      <div class="row">
        <label>Curve <select id="src"><option value="force_curve_v2">new channel (one point per reading)</option><option value="force_curve">documented channel (time steps)</option></select></label>
        <label>Compare to <select id="refsel"><option value="kleshnev">Kleshnev shape (front-loaded)</option><option value="rp3">RP3 shape (rounded, peak 45%)</option><option value="mine">my saved reference</option></select></label>
        <button id="saveref" title="Store this session's average curve as your personal reference">Save average as my reference</button>
      </div>
    </div>
    <div class="row legend">
      <span><i class="swatch" style="border-color: var(--s1)"></i>this stroke</span>
      <span><i class="swatch" style="border-color: rgba(57,135,229,.35)"></i>last 8 strokes</span>
      <span><i class="swatch" style="border-color: var(--s3)"></i>session average</span>
      <span><i class="swatch dash" style="border-color: var(--s2)"></i>reference</span>
    </div>
    <canvas id="curve"></canvas>
    <div id="hover"></div>
  </div>
  <div class="panel" id="panel_shape">
    <div class="row" style="justify-content: space-between"><h2 id="shapeTitle">Curve shape, this stroke</h2>
      <div class="row"><label>Targets <select id="school"><option value="kleshnev">Kleshnev (on-water crews)</option><option value="rp3">RP3 (rounded stroke)</option></select></label>
      <label>RP3 bands <select id="bands"><option value="off">off</option><option value="men">men</option><option value="women">women</option></select></label>
      <label>mass <input type="number" id="mass" min="30" max="200" step="0.5" style="width: 5em" title="Body mass in kg, for work and force per kilogram"> kg</label></div></div>
    <div class="metrics" id="metrics"></div>
  </div>
</main>

<section class="trends" id="trends"></section>

<div class="tablewrap" id="tablewrap">
  <table id="table"><thead><tr>
    <th>Stroke</th><th>Drive m</th><th>Drive s</th><th>Recov s</th><th>Ratio</th><th>Dist/stroke m</th><th>Peak lbf</th><th>Avg lbf</th><th>Work J</th><th>Power W</th><th>Peak pos</th><th>Rect idx</th><th>HR</th>
  </tr></thead><tbody></tbody></table>
</div>

<script>
// ---------- state ----------
const S = { strokes: new Map(), status: {}, summary: {}, device: {} };
const TARGETS = {  // Kleshnev (2011), Biomechanics of Rowing, via biomex.studio; on-water gate force, so guides not rules
  a100: { lo: 0, hi: 40, label: "≤40%" }, a70: { lo: 0, hi: 17, label: "≤17%" },
  d70: { lo: 28, hi: 40, label: "28–40%" }, ram: { lo: 38, hi: 64, label: "38–64%" }, dips: { lo: 0, hi: 0, label: "none" },
};
// Reference shape built to meet those targets. Scored by metrics() below it gives peak position 33%,
// catch gradient 13%, finish plateau 33%, rectangle index 61% (tests/test_logger.py checks this). A template, not a measured curve.
const KLESHNEV_PTS = [[0,0],[.06,.4],[.18,.85],[.36,1],[.66,.72],[.8,.25],[.92,.1],[1,0]];
// The other school: RP3 Rowing's rounded "Schubschlag" curve, peak just before the oar is square (their training guide v1.2,
// 2025, and force-curve white paper v1.3, 2023). Only the peak position has a number; the rest is "full and smooth", which
// their portal scores as the fit to a parabola. Their peak band is from a dynamic erg, so a guide here too.
const RP3 = { a100: { lo: 40, hi: 50, label: "40–50% (RP3: ideal 43–48%)" }, a70: null, d70: null, ram: null, dips: { lo: 0, hi: 0, label: "none" } };
const SCHOOLS = { kleshnev: TARGETS, rp3: RP3 };
// RP3's guideline bands (training guide v1.2, appendix), restated. Their erg is dynamic and its force is not the PM5's handle
// force, so this places a number roughly; it is not a ranking. Drive length is for a rower of average height.
const BANDS = {
  men: { work: [[350, "club"], [500, "intermediate"], [650, "elite"]], peak_n: [[250, "club"], [330, "intermediate"], [460, "elite"]],
         drive: [[1.30, "beginner"], [1.35, "intermediate"], [1.40, "expert"]], height: "1.75–1.85 m" },
  women: { work: [[300, "club"], [400, "intermediate"], [480, "elite"]], peak_n: [[200, "club"], [250, "intermediate"], [350, "elite"]],
           drive: [[1.20, "beginner"], [1.25, "intermediate"], [1.35, "expert"]], height: "1.65–1.75 m" },
};
function bandOf(v, list) { let name = "below " + list[0][1]; for (const [lo, label] of list) if (v >= lo) name = label; return name; }
const bandText = list => list.map(([lo, l]) => `${l} ${lo}+`).join(", ");
// Body mass, shared with the fitness settings (localStorage pm5_fitness.PM5_MASS_KG): per-kilogram work and force
// compare rowers of different sizes without inventing weight bands.
function massKg() { try { const v = parseFloat((JSON.parse(localStorage.getItem("pm5_fitness")) || {}).PM5_MASS_KG); return v > 0 ? v : null; } catch { return null; } }
function setMassKg(v) { try { const f = JSON.parse(localStorage.getItem("pm5_fitness")) || {}; if (v > 0) f.PM5_MASS_KG = String(v); else delete f.PM5_MASS_KG; localStorage.setItem("pm5_fitness", JSON.stringify(f)); } catch {} }
const RP3_SHAPE = Array.from({ length: 101 }, (_, i) => { const x = i / 100, p = 0.45; return x < p ? 1 - ((p - x) / p) ** 2 : 1 - ((x - p) / (1 - p)) ** 2; });

// ---------- curve maths ----------
function trim(p) { if (!p || p.length < 3) return null; let a = 0, b = p.length - 1; while (a < b && p[a] <= 0) a++; while (b > a && p[b] <= 0) b--; return b - a >= 2 ? p.slice(a, b + 1) : null; }
function resample(p, n = 101) { const m = p.length; return Array.from({ length: n }, (_, i) => { const x = i * (m - 1) / (n - 1), j = Math.floor(x), f = x - j; return j + 1 < m ? p[j] * (1 - f) + p[j + 1] * f : p[m - 1]; }); }
function fromControl(pts, n = 101) { // monotone-ish piecewise cubic (Catmull-Rom, clamped)
  const out = []; for (let i = 0; i < n; i++) { const x = i / (n - 1); let k = 0; while (k < pts.length - 2 && x > pts[k + 1][0]) k++;
    const p0 = pts[Math.max(0, k - 1)], p1 = pts[k], p2 = pts[k + 1], p3 = pts[Math.min(pts.length - 1, k + 2)]; const t = (x - p1[0]) / (p2[0] - p1[0] || 1);
    const t2 = t * t, t3 = t2 * t; const y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
    out.push(Math.max(0, y)); } return out; }
function metrics(points) {
  const tp = trim(points); if (!tp) return null;
  const r = resample(tp); const fmax = Math.max(...r), imax = r.indexOf(fmax); const mean = r.reduce((a, b) => a + b, 0) / r.length;
  const a70 = r.findIndex(v => v >= 0.7 * fmax); let j = imax; while (j < 100 && r[j + 1] >= 0.7 * fmax) j++;
  let dips = 0, runMax = 0, inDip = false; // a "blip": after force passes 50% of peak, it falls >=8% of peak then recovers >=5%
  for (let i = 0; i < r.length; i++) { const v = r[i]; if (v > runMax) { if (inDip && v - lowest >= 0.05 * fmax) { dips++; inDip = false; } runMax = v; }
    if (runMax >= 0.5 * fmax && runMax - v >= 0.08 * fmax && i < imax + 1) { if (!inDip) { inDip = true; var lowest = v; } lowest = Math.min(lowest, v); } }
  return { norm: r.map(v => v / fmax), fmax, a100: imax, a70, d70: j - imax, ram: 100 * mean / fmax, dips, r2: parabolaR2(r) };
}
function parabolaR2(r) { // least-squares y = a x^2 + b x + c on x in [0, 1]; R^2 is RP3's stroke-quality score (1 = a perfect parabola)
  const n = r.length; let sx = 0, sx2 = 0, sx3 = 0, sx4 = 0, sy = 0, sxy = 0, sx2y = 0;
  for (let i = 0; i < n; i++) { const x = i / (n - 1), y = r[i]; sx += x; sx2 += x * x; sx3 += x ** 3; sx4 += x ** 4; sy += y; sxy += x * y; sx2y += x * x * y; }
  const det = (m) => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  const A = [[sx4, sx3, sx2], [sx3, sx2, sx], [sx2, sx, n]], B = [sx2y, sxy, sy], D = det(A); if (!D) return 0;
  const col = (k) => det(A.map((row, i) => row.map((v, j) => j === k ? B[i] : v))) / D; const [a, b, c] = [col(0), col(1), col(2)];
  const mean = sy / n; let ssr = 0, sst = 0;
  for (let i = 0; i < n; i++) { const x = i / (n - 1), f = a * x * x + b * x + c; ssr += (r[i] - f) ** 2; sst += (r[i] - mean) ** 2; }
  return sst ? Math.max(0, 1 - ssr / sst) : 0;
}
function rmsePct(a, b) { if (!a || !b) return null; let s = 0; for (let i = 0; i < a.length; i++) s += (a[i] - b[i]) ** 2; return 100 * Math.sqrt(s / a.length); }
function meanCurve(list) { const c = list.filter(Boolean); if (!c.length) return null; const m = c[0].map((_, i) => c.reduce((s, x) => s + x[i], 0) / c.length); const mx = Math.max(...m); return m.map(v => v / mx); }

// ---------- formatting ----------
const fmtPace = s => !s ? "—" : `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
const fmtTime = s => s == null ? "—" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const n0 = v => v == null || Number.isNaN(v) ? "—" : Math.round(v).toString();
const n1 = v => v == null || Number.isNaN(v) ? "—" : v.toFixed(1);
const n2 = v => v == null || Number.isNaN(v) ? "—" : v.toFixed(2);

// ---------- tiles ----------
const TILE_DEFS = [
  ["time", "Time"], ["dist", "Distance"], ["pace", "Pace /500m"], ["rate", "Rate"], ["power", "Power"], ["hr", "Heart rate"],
  ["peak", "Peak force"], ["drive", "Drive"], ["ratio", "Drive : recovery"], ["stroke", "Per stroke"], ["drag", "Drag factor"], ["cal", "Calories"],
];
document.getElementById("tiles").innerHTML = TILE_DEFS.map(([k, l]) => `<div class="tile" id="tile_${k}"><div class="label">${l}</div><div class="value" id="v_${k}">—</div><div class="sub" id="s_${k}"></div></div>`).join("");
const setTile = (k, v, sub = "") => { document.getElementById("v_" + k).textContent = v; document.getElementById("s_" + k).textContent = sub; };
function renderTiles() {
  const st = S.status, last = lastStroke();
  const target = st.workout_type != null && st.workout_type > 1;  // projections mean nothing on a Just Row (types 0, 1)
  setTile("time", fmtTime(st.elapsed_s), target && st.projected_time_s ? `projected ${fmtTime(st.projected_time_s)}` : "");
  setTile("dist", st.distance_m != null ? `${Math.round(st.distance_m)} m` : "—", target && st.projected_distance_m ? `projected ${st.projected_distance_m} m` : "");
  setTile("pace", fmtPace(st.pace_s), st.avg_pace_s ? `average ${fmtPace(st.avg_pace_s)}` : "");
  setTile("rate", n0(st.stroke_rate), "strokes/min");
  setTile("power", last && last.power_w != null ? `${last.power_w} W` : "—", st.avg_power_w ? `average ${st.avg_power_w} W` : "");
  setTile("hr", st.hr ? n0(st.hr) : "—", st.hr ? "bpm" : "no HR source paired");
  setTile("peak", last ? `${n0(last.peak_force_lbf)}` : "—", last ? `lbf · average ${n0(last.avg_force_lbf)}` : "");
  setTile("drive", last ? `${n2(last.drive_length_m)} m` : "—", last ? `${n2(last.drive_time_s)} s` : "");
  const prev = S.strokes.get(last && last.stroke_count - 1); const rec = last && (last.recovery_time_s ?? (prev && prev.recovery_time_s));
  setTile("ratio", last && rec ? `1 : ${n1(rec / last.drive_time_s)}` : "—", "target about 1 : 2");
  setTile("stroke", last ? `${n1(last.stroke_distance_m)} m` : "—", last ? `work ${n0(last.work_j)} J` : "");
  setTile("drag", n0(st.drag_factor), S.summary.drag_factor_avg ? `session ${S.summary.drag_factor_avg}` : "");
  setTile("cal", n0(st.calories_total), "kcal");
}

// ---------- charts ----------
function setupCanvas(c) { const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight; if (c.width !== w * dpr || c.height !== h * dpr) { c.width = w * dpr; c.height = h * dpr; } const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h); return [g, w, h]; }
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const canvasFont = () => `${Math.round(11 * (parseFloat(css("--text")) || 1))}px -apple-system, sans-serif`;
const src = () => document.getElementById("src").value;
const refKey = () => document.getElementById("refsel").value;
const KLESHNEV = fromControl(KLESHNEV_PTS);
function reference() { if (refKey() === "mine") { try { return JSON.parse(localStorage.getItem("pm5_my_reference")); } catch { return null; } } return refKey() === "rp3" ? RP3_SHAPE : KLESHNEV; }
const school = () => SCHOOLS[document.getElementById("school").value] || TARGETS;
const bands = () => BANDS[document.getElementById("bands").value] || null;
function rememberChoices() { try { localStorage.setItem("pm5_choices", JSON.stringify({ ref: refKey(), school: document.getElementById("school").value, bands: document.getElementById("bands").value })); } catch {} }
(function restoreChoices() { try { const c = JSON.parse(localStorage.getItem("pm5_choices")) || {}; for (const [id, k] of [["refsel", "ref"], ["school", "school"], ["bands", "bands"]]) if (c[k]) document.getElementById(id).value = c[k]; } catch {} })();
const strokesWithCurves = () => [...S.strokes.values()].filter(s => trim(s[src()])).sort((a, b) => a.stroke_count - b.stroke_count);
const lastStroke = () => { const all = [...S.strokes.values()]; return all.length ? all.reduce((a, b) => b.stroke_count > a.stroke_count ? b : a) : null; };

let hoverX = null;
function drawCurve() {
  const c = document.getElementById("curve"); const [g, w, h] = setupCanvas(c);
  const pad = { l: 44, r: 16, t: 10, b: 44 }, pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
  const list = strokesWithCurves(); const cur = list[list.length - 1];
  const recent = list.slice(-9, -1);
  const series = list.map(s => metrics(s[src()])).filter(Boolean);
  const avg = meanCurve(series.map(m => m.norm));
  const ymax = Math.max(40, ...list.slice(-9).map(s => Math.max(...trim(s[src()])))) * 1.1;
  // grid + axes
  g.strokeStyle = css("--grid"); g.lineWidth = 1; g.fillStyle = css("--ink3"); g.font = canvasFont();
  for (let f = 0; f <= ymax; f += ymax > 150 ? 50 : 25) { const y = pad.t + ph - f / ymax * ph; g.beginPath(); g.moveTo(pad.l, y); g.lineTo(w - pad.r, y); g.stroke(); g.fillText(`${f}`, 8, y + 4); }
  g.textAlign = "center";
  for (let p = 0; p <= 100; p += 20) g.fillText(`${p}%`, pad.l + p / 100 * pw, pad.t + ph + 16);
  g.fillText("drive, from first force to release (normalised)", pad.l + pw / 2, h - 6);
  g.save(); g.translate(12, pad.t + ph / 2); g.rotate(-Math.PI / 2); g.fillText("force (lbf)", 0, 0); g.restore();
  g.textAlign = "left";
  const X = i => pad.l + i / 100 * pw, Y = f => pad.t + ph - f / ymax * ph;
  const line = (arr, color, width, dash = [], scale = 1) => { if (!arr) return; g.setLineDash(dash); g.strokeStyle = color; g.lineWidth = width; g.beginPath(); arr.forEach((v, i) => i ? g.lineTo(X(i), Y(v * scale)) : g.moveTo(X(i), Y(v * scale))); g.stroke(); g.setLineDash([]); };
  recent.forEach(s => line(resample(trim(s[src()])), "rgba(57,135,229,.28)", 1.5));
  const curM = cur ? metrics(cur[src()]) : null; const scale = curM ? curM.fmax : (series.length ? series[series.length - 1].fmax : 1);
  line(reference(), css("--s2"), 2, [6, 5], scale);            // shapes scaled to this stroke's peak, so shape is what differs
  line(avg, css("--s3"), 2, [], scale);
  if (cur) line(resample(trim(cur[src()])), css("--s1"), 3);
  if (curM) { g.fillStyle = css("--s1"); g.beginPath(); g.arc(X(curM.a100), Y(curM.fmax), 4, 0, 7); g.fill(); }
  if (hoverX != null && cur) { const i = Math.round(Math.max(0, Math.min(100, (hoverX - pad.l) / pw * 100))); g.strokeStyle = css("--ink3"); g.beginPath(); g.moveTo(X(i), pad.t); g.lineTo(X(i), pad.t + ph); g.stroke();
    const r = resample(trim(cur[src()])); const ref = reference();
    document.getElementById("hover").textContent = `${i}% of drive · this stroke ${n0(r[i])} lbf · average ${avg ? n0(avg[i] * scale) : "—"} · reference ${ref ? n0(ref[i] * scale) : "—"}`; }
  else document.getElementById("hover").textContent = cur ? `stroke ${cur.stroke_count}: hover the chart to read values` : "waiting for the first stroke…";
}
document.getElementById("curve").addEventListener("mousemove", e => { hoverX = e.offsetX; drawCurve(); });
document.getElementById("curve").addEventListener("mouseleave", () => { hoverX = null; drawCurve(); });

function renderMetrics() {
  const list = strokesWithCurves(); const cur = list[list.length - 1]; const el = document.getElementById("metrics");
  if (!cur) { el.innerHTML = `<div class="note">Force-curve metrics appear after the first stroke.</div>`; return; }
  const m = metrics(cur[src()]); const series = list.map(s => metrics(s[src()])).filter(Boolean); const avg = meanCurve(series.map(x => x.norm));
  const ref = reference(), T = school(), B = bands(); const inRange = (v, t) => v >= t.lo && v <= t.hi;
  const flag = (v, t, lowWord, highWord) => !t ? "" : inRange(v, t) ? `<span class="flag ok">✓ in range</span>` : `<span class="flag off">▲ ${v > t.hi ? highWord : lowWord}</span>`;
  const label = t => t ? t.label : "no target in this school";
  const peakN = cur.peak_force_lbf ? cur.peak_force_lbf * 4.448 : null, mass = massKg();
  const bandRow = (name, value, unit, key, note) => B && value != null ? [[name, `${unit === "m" ? n2(value) : n0(value)} ${unit}`, `RP3 ${document.getElementById("bands").value}: ${bandText(B[key])}`, `<span class="flag">${bandOf(value, B[key])}</span>`, note]] : [];
  const rows = [
    ["Peak position", `${m.a100}%`, label(T.a100), flag(m.a100, T.a100, "early", "late"), "Where in the drive force peaks. Kleshnev's crews peak early (legs); RP3's rounded stroke peaks just before the oar is square, around 43–48%. Later than 55% points to the back taking over from the legs."],
    ["Catch gradient", `${m.a70}%`, label(T.a70), flag(m.a70, T.a70, "", "slow"), "How far into the drive before force reaches 70% of peak: how quickly the legs load."],
    ["Finish plateau", `${m.d70}%`, label(T.d70), flag(m.d70, T.d70, "short", "long"), "How long force stays above 70% of peak after the peak: the back and arms carrying it on."],
    ["Rectangle index", `${n0(m.ram)}%`, label(T.ram), flag(m.ram, T.ram, "peaky", "flat"), "Average force as a share of peak. Higher is a fuller curve; a parabola scores 67%."],
    ["Parabola fit", `${n0(100 * m.r2)}%`, "higher = rounder", "", "How closely the curve follows a parabola, RP3's stroke-quality score. Effective work per stroke is work × this."],
    ["Blips", `${m.dips}`, label(T.dips), m.dips ? `<span class="flag off">▲ dip in the rise</span>` : `<span class="flag ok">✓ smooth</span>`, "A dip on the way up, usually the handover from legs to back."],
    ["Shape vs reference", ref ? `${n1(rmsePct(m.norm, ref))}%` : "—", "lower = closer", "", "Typical gap between this stroke's shape and the reference, as % of peak (both scaled to the same peak)."],
    ["Stroke-to-stroke", avg && series.length > 1 ? `${n1(rmsePct(m.norm, avg))}%` : "—", "lower = steadier", "", "Gap between this stroke's shape and your session average."],
    ...bandRow("Work per stroke", cur.work_j, "J", "work", `Energy into the flywheel this stroke${cur.work_j ? `; × parabola fit = ${n0(cur.work_j * m.r2)} J effective (RP3)` : ""}. RP3's bands come from a dynamic erg, so a rough placement, not a ranking.`),
    ...bandRow("Peak force", peakN, "N", "peak_n", "Peak handle force in newtons. RP3's bands are not from PM5 handle force, so treat the placement loosely."),
    ...bandRow("Drive length", cur.drive_length_m, "m", "drive", `RP3's bands for a rower of ${B ? B.height : ""}; taller rowers row longer.`),
    ...(mass && cur.work_j ? [["Work per kg", `${n1(cur.work_j / mass)} J/kg`, "higher = more work for your size", "", `Work per stroke divided by your body mass (${mass} kg): the fairer comparison between rowers of different sizes.`]] : []),
    ...(mass && peakN ? [["Peak force per kg", `${n2(peakN / mass)} N/kg`, "for your size", "", `Peak handle force divided by your body mass (${mass} kg).`]] : []),
    ...(!mass ? [["Per kilogram", "—", "enter your mass (kg) above", "", "With your body mass, work and peak force are also shown per kilogram, which compares rowers of different sizes without weight classes."]] : []),
  ];
  el.innerHTML = rows.map(([k, v, t, f, note]) => `<div>${k}<div class="t">target ${t} ${f}</div></div><div></div><div class="v">${v}</div><div class="note">${note}</div>`).join("");
  document.getElementById("shapeTitle").textContent = `Curve shape, stroke ${cur.stroke_count}`;
}

const TRENDS = [
  ["Peak force (lbf)", s => s.peak_force_lbf, null],
  ["Peak position (% of drive)", s => metrics(s[src()])?.a100, () => school().a100],
  ["Rectangle index (%)", s => metrics(s[src()])?.ram, () => school().ram],
  ["Drive length (m)", s => s.drive_length_m, null],
  ["Power (W)", s => s.power_w, null],
];
document.getElementById("trends").innerHTML = TRENDS.map((t, i) => `<div class="panel" id="trend${i}"><h2>${t[0]}${t[2] ? ` <span style="font-weight:400;color:var(--ink3)">· shaded: target</span>` : ""}</h2><canvas id="tr${i}"></canvas></div>`).join("");
function drawTrends() {
  const list = [...S.strokes.values()].sort((a, b) => a.stroke_count - b.stroke_count);
  TRENDS.forEach(([name, fn, bandFn], i) => { const band = bandFn ? bandFn() : null;
    const c = document.getElementById("tr" + i); const [g, w, h] = setupCanvas(c); const pad = { l: 34, r: 8, t: 6, b: 18 };
    const pts = list.map(s => [s.stroke_count, fn(s)]).filter(p => p[1] != null && !Number.isNaN(p[1]));
    g.fillStyle = css("--ink3"); g.font = canvasFont();
    if (!pts.length) { g.fillText("no strokes yet", pad.l, h / 2); return; }
    let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1])); if (band) { lo = Math.min(lo, band.lo); hi = Math.max(hi, band.hi); }
    const span = hi - lo || 1; const floor0 = lo >= 0; lo -= span * .1; hi += span * .1; if (floor0) lo = Math.max(0, lo);
    const fmt = v => span < 5 ? v.toFixed(2) : span < 50 ? v.toFixed(1) : Math.round(v).toString();
    const x0 = pts[0][0], x1 = Math.max(pts[pts.length - 1][0], x0 + 1);
    const X = n => pad.l + (n - x0) / (x1 - x0) * (w - pad.l - pad.r), Y = v => pad.t + (1 - (v - lo) / (hi - lo)) * (h - pad.t - pad.b);
    if (band) { g.fillStyle = "rgba(58,166,85,.12)"; g.fillRect(pad.l, Y(band.hi), w - pad.l - pad.r, Y(band.lo) - Y(band.hi)); }
    g.strokeStyle = css("--grid"); g.beginPath(); g.moveTo(pad.l, h - pad.b); g.lineTo(w - pad.r, h - pad.b); g.stroke();
    g.fillStyle = css("--ink3"); g.fillText(fmt(hi), 2, pad.t + 9); g.fillText(fmt(lo), 2, h - pad.b); g.fillText(`stroke ${x0}`, pad.l, h - 4); g.fillText(`${x1}`, w - pad.r - 16, h - 4);
    g.strokeStyle = css("--s1"); g.lineWidth = 2; g.beginPath(); pts.forEach(([n, v], k) => k ? g.lineTo(X(n), Y(v)) : g.moveTo(X(n), Y(v))); g.stroke();
    const [ln, lv] = pts[pts.length - 1]; g.fillStyle = css("--s1"); g.beginPath(); g.arc(X(ln), Y(lv), 3.5, 0, 7); g.fill();
    g.fillStyle = css("--ink"); g.fillText(fmt(lv), Math.min(X(ln) + 6, w - 34), Math.max(12, Y(lv) - 6));
  });
}

function renderTable() {
  const list = [...S.strokes.values()].sort((a, b) => b.stroke_count - a.stroke_count).slice(0, uiValue("rows"));
  document.querySelector("#table tbody").innerHTML = list.map(s => { const m = metrics(s[src()]); const ratio = s.recovery_time_s && s.drive_time_s ? `1:${n1(s.recovery_time_s / s.drive_time_s)}` : "—";
    return `<tr><td>${s.stroke_count}</td><td>${n2(s.drive_length_m)}</td><td>${n2(s.drive_time_s)}</td><td>${n2(s.recovery_time_s)}</td><td>${ratio}</td><td>${n2(s.stroke_distance_m)}</td><td>${n0(s.peak_force_lbf)}</td><td>${n0(s.avg_force_lbf)}</td><td>${n0(s.work_j)}</td><td>${n0(s.power_w)}</td><td>${m ? m.a100 + "%" : "—"}</td><td>${m ? n0(m.ram) + "%" : "—"}</td><td>${s.hr ? s.hr : "—"}</td></tr>`; }).join("");
}

let pending = false;
function render() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; renderTiles(); drawCurve(); renderMetrics(); drawTrends(); renderTable(); }); }
window.addEventListener("resize", render);
// ---------- display: sizes and what is shown, remembered per browser ----------
// Sliders set a CSS variable (a null property means the value is only read by the code, like the
// number of table rows). Any part in partGroups() can be switched off from the menu, or with the
// ✕ that "click parts off" puts on each one.
const UI = { text: ["--text", 1, v => `${Math.round(v * 100)}%`, v => v],
             h: ["--curve-h", 270, v => `${v} px`, v => `${v}px`],
             w: ["--curve-w", 56, v => `${v}%`, v => `${v}%`],
             tile: ["--tile-w", 150, v => `${v} px`, v => `${v}px`],
             trend: ["--trend-h", 120, v => `${v} px`, v => `${v}px`],
             rows: [null, 12, v => `${v}`, v => v] };
const hidden = new Set();
function loadUI() { try { return JSON.parse(localStorage.getItem("pm5_display")) || {}; } catch { return {}; } }
const uiValue = k => { const el = document.getElementById("ui_" + k); const v = el ? parseFloat(el.value) : NaN; return Number.isNaN(v) ? UI[k][1] : v; };

/** Everything that can be hidden, in the order the menu lists it. Parts a page doesn't have (the
 *  Python-served dashboard has no guided or fitness panel) are left out. */
function partGroups() {
  return [["Tiles", TILE_DEFS.map(([k, l]) => ["tile_" + k, l])],
          ["Charts", [["panel_curve", "Force curve"], ["panel_shape", "Curve shape"], ...TRENDS.map((t, i) => ["trend" + i, t[0].replace(/ \(.*/, "")])]],
          ["Sections", [["setup", "Set up the PM5"], ["guided", "Guided session"], ["tablewrap", "Stroke table"], ["fitness", "Fitness panel"], ["sessions", "Saved rows"]]]]
    .map(([g, items]) => [g, items.filter(([id]) => document.getElementById(id))]).filter(([, items]) => items.length);
}
const allParts = () => partGroups().flatMap(([, items]) => items);

function applyHidden() {
  for (const [id] of allParts()) document.getElementById(id).classList.toggle("hidden-part", hidden.has(id));
  const m = document.querySelector("main");
  if (m) m.style.gridTemplateColumns = hidden.has("panel_curve") || hidden.has("panel_shape") ? "1fr" : "";
  const tr = document.getElementById("trends"); if (tr) tr.classList.toggle("hidden-part", TRENDS.every((_, i) => hidden.has("trend" + i)));
  document.querySelectorAll("#ui_parts input[type=checkbox]").forEach(cb => { cb.checked = !hidden.has(cb.dataset.part); });
  document.querySelectorAll(".hidex").forEach(b => b.remove());
  if (!document.getElementById("ui_customise") || !document.getElementById("ui_customise").checked) return;
  for (const [id, label] of allParts()) {
    if (hidden.has(id)) continue;
    const el = document.getElementById(id), b = document.createElement("button");
    el.classList.add("hostx"); b.className = "hidex"; b.textContent = "✕"; b.title = `Hide ${label}`;
    b.addEventListener("click", ev => { ev.stopPropagation(); ev.preventDefault(); hidden.add(id); applyUI(); });
    el.appendChild(b);
  }
}


// ---------- arrange: drag the parts about, resize them by their corner ----------
// Order is saved per container (which parts sit in which order inside the tiles grid, the
// trends grid, the two-panel row and the page itself). Resizing a tile, a trend panel or the
// force-curve panel sets the same value its slider does, so the two stay in step.
const arrangeIds = () => [...allParts().map(([id]) => id), "tiles", "main", "trends", "more"].filter(id => document.getElementById(id));
const loadLayout = () => { try { return JSON.parse(localStorage.getItem("pm5_layout")) || {}; } catch { return {}; } };
const saveLayout = l => { try { localStorage.setItem("pm5_layout", JSON.stringify(l)); } catch { /* private mode */ } };
const containerId = el => (el.parentElement === document.body ? "body" : el.parentElement.id || null);

function applyOrder() {
  const { order = {} } = loadLayout();
  for (const [cid, ids] of Object.entries(order)) {
    const parent = cid === "body" ? document.body : document.getElementById(cid);
    if (!parent) continue;
    for (const id of ids) { const el = document.getElementById(id); if (el && el.parentElement === parent) parent.appendChild(el); }
  }
}
function rememberOrder(cid) {
  const parent = cid === "body" ? document.body : document.getElementById(cid);
  const ids = [...parent.children].map(c => c.id).filter(id => id && arrangeIds().includes(id));
  const l = loadLayout(); l.order = { ...(l.order || {}), [cid]: ids }; saveLayout(l);
}

let dragging = null;
function onDragStart(e) { e.stopPropagation(); dragging = e.currentTarget; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragging.id); }
function onDragOver(e) {
  if (!dragging || e.currentTarget === dragging || containerId(e.currentTarget) !== containerId(dragging)) return;
  e.preventDefault(); e.stopPropagation();
  const el = e.currentTarget, r = el.getBoundingClientRect();
  const after = (r.width > r.height * 1.5 ? e.clientX - r.left > r.width / 2 : e.clientY - r.top > r.height / 2);
  el.parentElement.insertBefore(dragging, after ? el.nextSibling : el);
}
function onDrop(e) { if (!dragging) return; e.preventDefault(); e.stopPropagation(); rememberOrder(containerId(dragging)); dragging = null; render(); }

/** A resized part sets the matching slider, so one control doesn't contradict the other. */
function onResized(el) {
  // only a size the user dragged counts: resize writes it into the element's own style, while
  // the layout's own sizes come from the variables, and reading those back would feed on itself
  const w = parseFloat(el.style.width), h = parseFloat(el.style.height);
  if (!w && !h) return;
  const set = (k, v) => { const s = document.getElementById("ui_" + k); if (!s) return; s.value = Math.round(v); applyUI(); };
  if (el.id.startsWith("tile_")) { if (w) set("tile", Math.min(360, Math.max(110, w / (parseFloat(css("--text")) || 1)))); }
  else if (el.id.startsWith("trend")) { if (h) set("trend", Math.min(300, Math.max(70, h - 44))); }
  else if (el.id === "panel_curve" || el.id === "panel_shape") {
    const m = document.getElementById("main"), full = m ? m.clientWidth : window.innerWidth;
    if (w) set("w", Math.min(80, Math.max(30, el.id === "panel_curve" ? 100 * w / full : 100 - 100 * w / full)));
    if (h && el.id === "panel_curve") set("h", Math.min(640, Math.max(140, h - 170)));
  }
}

function applyArrange() {
  const on = document.getElementById("ui_customise") && document.getElementById("ui_customise").checked;
  for (const id of arrangeIds()) {
    const el = document.getElementById(id);
    el.classList.toggle("arranging", on);
    el.draggable = on;
    el.ondragstart = on ? onDragStart : null;
    el.ondragover = on ? onDragOver : null;
    el.ondrop = on ? onDrop : null;
    el.ondragend = on ? () => { dragging = null; } : null;
  }
  if (on && !applyArrange.observer) {
    applyArrange.observer = new ResizeObserver(es => { if (document.getElementById("ui_customise").checked) for (const e of es) onResized(e.target); });
    for (const id of ["panel_curve", "panel_shape", "trend0", "trend1", "trend2", "trend3", "trend4", ...TILE_DEFS.map(([k]) => "tile_" + k)])
      if (document.getElementById(id)) applyArrange.observer.observe(document.getElementById(id));
    document.addEventListener("pointerup", () => document.querySelectorAll(".arranging").forEach(el => { el.style.width = ""; el.style.height = ""; }));
  }
}

function applyUI(save = true) {
  const cur = {};
  for (const [k, [prop, , show, cssv]] of Object.entries(UI)) {
    const el = document.getElementById("ui_" + k); if (!el) continue;
    const v = parseFloat(el.value); cur[k] = v;
    if (prop) document.documentElement.style.setProperty(prop, cssv(v));
    document.getElementById(`ui_${k}_v`).textContent = show(v);
  }
  cur.hidden = [...hidden];
  if (save) { try { localStorage.setItem("pm5_display", JSON.stringify(cur)); } catch { /* private mode */ } }
  applyHidden();
  applyArrange();
  render();
}
function initUI() {
  const saved = loadUI();
  for (const [k, [, dflt]] of Object.entries(UI)) { const el = document.getElementById("ui_" + k); if (!el) continue; el.value = saved[k] ?? dflt; el.addEventListener("input", () => applyUI()); }
  for (const id of saved.hidden || []) hidden.add(id);
  applyOrder();
  document.getElementById("ui_parts").innerHTML = partGroups().map(([g, items]) =>
    `<div class="pgroup"><b>${g}</b>${items.map(([id, l]) => `<label><input type="checkbox" data-part="${id}"> ${l}</label>`).join("")}</div>`).join("");
  document.getElementById("ui_parts").addEventListener("change", e => {
    const cb = e.target.closest("input[data-part]"); if (!cb) return;
    if (cb.checked) hidden.delete(cb.dataset.part); else hidden.add(cb.dataset.part);
    applyUI();
  });
  document.getElementById("ui_customise").addEventListener("change", () => applyUI());
  document.getElementById("ui_showall").addEventListener("click", () => { hidden.clear(); applyUI(); });
  document.getElementById("ui_reset").addEventListener("click", () => {
    for (const [k, [, dflt]] of Object.entries(UI)) { const el = document.getElementById("ui_" + k); if (el) el.value = dflt; }
    hidden.clear(); saveLayout({}); location.reload();          // the saved order is undone by reloading the page as written
  });
  applyUI(false);
}
initUI();
document.getElementById("src").addEventListener("change", render);
document.getElementById("refsel").addEventListener("change", () => { rememberChoices(); render(); });
document.getElementById("school").addEventListener("change", () => { rememberChoices(); render(); });
document.getElementById("bands").addEventListener("change", () => { rememberChoices(); render(); });
document.getElementById("mass").value = massKg() ?? "";
document.getElementById("mass").addEventListener("change", () => { setMassKg(parseFloat(document.getElementById("mass").value)); if (document.getElementById("fit_mass")) document.getElementById("fit_mass").value = document.getElementById("mass").value; render(); });
document.getElementById("saveref").addEventListener("click", () => {
  const series = strokesWithCurves().map(s => metrics(s[src()])).filter(Boolean); const avg = meanCurve(series.map(m => m.norm));
  if (!avg) { alert("No force curves yet in this session."); return; }
  localStorage.setItem("pm5_my_reference", JSON.stringify(avg)); document.getElementById("refsel").value = "mine";
  document.getElementById("banner").textContent = `saved the average of ${series.length} strokes as your reference`; render();
});

// ---------- set up the PM5 from the page ----------
async function loadWorkouts() {
  try { const r = await fetch("/workouts"); const j = await r.json(); const sel = document.getElementById("wo_named");
    j.workouts.forEach(w => { const o = document.createElement("option"); o.value = w.name; o.textContent = `${w.name} · ${w.description}`; sel.appendChild(o); }); } catch {}
}
async function sendProgram(payload) {
  const st = document.getElementById("wo_status"); st.className = ""; st.textContent = payload.terminate ? "clearing…" : "sending to the PM5…";
  try { const r = await fetch("/program", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); const j = await r.json();
    if (r.ok) { st.className = "ok"; st.textContent = j.workout ? `PM5 set: ${j.workout}. Row when ready.` : "cleared"; }
    else { st.className = "err"; st.textContent = j.error || `error ${r.status}`; } }
  catch (e) { st.className = "err"; st.textContent = "the logger is not reachable"; }
}
document.getElementById("wo_named").addEventListener("change", e => { document.getElementById("wo_spec").value = e.target.value; });
document.getElementById("wo_send").addEventListener("click", () => { const spec = document.getElementById("wo_spec").value.trim(); if (!spec) { document.getElementById("wo_status").textContent = "choose a workout or type one"; return; } sendProgram({ spec }); });
document.getElementById("wo_spec").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("wo_send").click(); });
document.getElementById("wo_clear").addEventListener("click", () => sendProgram({ terminate: true }));
loadWorkouts();

// ---------- live feed ----------
const H = {
  snapshot: d => { S.strokes.clear(); d.strokes.forEach(s => S.strokes.set(s.stroke_count, s)); S.status = d.status || {}; S.summary = d.summary || {}; },
  reset: d => { S.strokes.clear(); S.status = {}; S.summary = {}; document.getElementById("banner").textContent = d.replay ? `replaying ${d.replay}` : ""; },
  device: d => { S.device = d; document.getElementById("banner").textContent = `${d.name} · firmware ${d.firmware_rev}${d.workout ? " · " + d.workout : ""}`; },
  status: d => { S.status = d; },
  stroke: d => { S.strokes.set(d.stroke_count, d); },
  stroke_update: d => { const s = S.strokes.get(d.stroke_count); if (s) Object.assign(s, d); },
  curve: d => { const s = S.strokes.get(d.stroke_count); if (s) s[d.key] = d.points; },
  summary: d => { S.summary = d; },
  new_piece: () => { document.getElementById("banner").textContent = "a new piece started on the PM5: this session is being saved; run the logger again for the next piece"; },
  ended: d => { document.getElementById("banner").textContent = `session ${d.session} ended and saved`; },
};
function connect() {
  const es = new EventSource("/events"); const conn = document.getElementById("conn");
  es.onopen = () => { conn.textContent = "live"; conn.className = "live"; };
  es.onmessage = e => { const m = JSON.parse(e.data); (H[m.kind] || (() => {}))(m.data); render(); };
  es.onerror = () => { conn.textContent = "not connected: is the logger running?"; conn.className = ""; };
}
connect(); render();
</script>
</body>
